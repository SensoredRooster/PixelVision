[project]
name = "pixelvision"
version = "0.1.0"
description = "Windows spectator / VOD review console for FPS aim anomalies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10.0",
  "numpy>=1.26.0",
  "PySide6>=6.11.2",
  "mss>=9.0.0",
  "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
train = ["torch>=2.5.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
